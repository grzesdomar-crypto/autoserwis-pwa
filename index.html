<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0a0a0e">
<meta name="description" content="Aplikacja do śledzenia przeglądów i serwisów samochodowych">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>AutoSerwis</title>
<script id="pd">window.__PD__=null</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Barlow+Condensed:wght@700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0a0a0e;color:#e5e7eb;font-family:'DM Mono','Courier New',monospace;min-height:100vh;padding-bottom:40px}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:#222;border-radius:2px}
button{font-family:inherit;cursor:pointer;transition:opacity .15s}button:active{opacity:.65}
input,select,textarea{font-family:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:#f59e0b!important;box-shadow:0 0 0 2px rgba(245,158,11,.15)}
select{background:#0a0a0e;border:1px solid #27272d;border-radius:6px;padding:7px 10px;color:#e5e7eb;font-size:13px}
textarea{background:#0a0a0e;border:1px solid #27272d;border-radius:6px;padding:7px 10px;color:#e5e7eb;font-size:13px;resize:vertical;min-height:60px}
.card{background:#0d0d14;border:1px solid #1a1a22;border-radius:10px;overflow:hidden}
.fade{animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
#topbar{position:sticky;top:0;z-index:50;background:#0d0d14;border-bottom:1px solid #14141e;padding:0 14px;display:flex;align-items:center;height:52px;gap:12px}
.logo{display:flex;align-items:center;gap:7px;color:#f59e0b;font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:900;letter-spacing:1.5px}
.logo span{color:#e5e7eb}.logo svg{flex-shrink:0}
.btn{border:none;border-radius:7px;padding:7px 13px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:5px;letter-spacing:.3px;white-space:nowrap}
.btn-amber{background:rgba(245,158,11,.12);color:#f59e0b;border:1px solid #78350f}
.btn-green{background:#16a34a;color:#fff}
.btn-blue{background:rgba(96,165,250,.1);color:#60a5fa;border:1px solid #1e3a5f}
.btn-ghost{background:transparent;color:#9ca3af;border:1px solid #27272d}
.btn-danger{background:rgba(239,68,68,.1);color:#ef4444;border:1px solid #7f1d1d}
.btn-purple{background:rgba(167,139,250,.1);color:#a78bfa;border:1px solid #3b2a5e}
.btn-cyan{background:rgba(34,211,238,.1);color:#22d3ee;border:1px solid #155e75}
.btn-orange{background:rgba(251,146,60,.1);color:#fb923c;border:1px solid #7c2d12}
.btn-sm{padding:5px 9px;font-size:11px}
#tabs{display:flex;gap:6px;flex-wrap:wrap;padding:14px 14px 10px;align-items:center}
.tab{padding:6px 12px;border-radius:8px;background:transparent;border:1px solid #1e1e26;color:#4b5563;font-size:12px;display:inline-flex;align-items:center;gap:6px;transition:all .13s}
.tab.active{background:rgba(245,158,11,.1);border-color:#f59e0b;color:#f59e0b;font-weight:600}
.badge{font-size:10px;border-radius:9px;padding:1px 5px;font-weight:700}
.badge-red{background:#dc2626;color:#fff}.badge-amber{background:#d97706;color:#000}.badge-purple{background:#7c3aed;color:#fff}.badge-cyan{background:#0891b2;color:#fff}
.view-toggle{display:flex;gap:0;margin:0 14px 10px;background:#0d0d14;border:1px solid #1a1a22;border-radius:8px;overflow:hidden;flex-wrap:wrap}
.view-toggle button{flex:1;padding:9px 8px;border:none;background:transparent;color:#4b5563;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:4px;transition:all .15s;min-width:60px}
.view-toggle button.active{background:rgba(245,158,11,.1);color:#f59e0b}
.view-toggle button:not(:last-child){border-right:1px solid #1a1a22}
#car-header{margin:0 14px 10px;padding:13px 16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.car-name{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;letter-spacing:.5px}
.plate{background:#111118;border:1px solid #1e1e26;border-radius:4px;padding:2px 9px;font-size:12px;color:#6b7280;letter-spacing:2px}
.km-wrap{display:flex;flex-direction:column;gap:3px;align-items:flex-end}
.km-label{font-size:9px;color:#374151;letter-spacing:.7px}
.km-input-row{display:flex;align-items:center;gap:5px}
.km-input{background:#0a0a0e;border:1px solid #f59e0b;border-radius:6px;padding:6px 10px;color:#f59e0b;font-size:17px;font-weight:500;width:110px;text-align:right}
.status-pills{display:flex;gap:6px;flex-wrap:wrap}
.status-pill{border-radius:7px;padding:5px 10px;text-align:center;min-width:50px}
.pill-num{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:900;line-height:1}
.pill-lbl{font-size:8px;letter-spacing:.3px;margin-top:1px}
#items-list{padding:0 14px;display:flex;flex-direction:column;gap:5px}
.item-card{border-radius:10px;overflow:hidden;transition:border-color .2s}
.item-row{padding:10px 13px;display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
.item-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.item-name{font-size:13px;font-weight:500;color:#e5e7eb}
.item-sub{font-size:10px;color:#374151;margin-top:1px}
.col-last{text-align:center;min-width:84px}.col-next{text-align:center;min-width:96px}.col-left{text-align:right;min-width:74px}
.col-lbl{font-size:9px;color:#27272d;letter-spacing:.5px;margin-bottom:2px}
.item-expand{border-top-width:1px;border-top-style:solid;padding:13px 14px;background:rgba(0,0,0,.38)}
.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.tl-entry{position:relative;padding-left:22px;padding-bottom:12px}
.tl-line{position:absolute;left:7px;top:11px;bottom:0;width:1px;background:#1e1e26}
.tl-dot{position:absolute;left:3px;top:7px;width:9px;height:9px;border-radius:50%}
.tl-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:26px}
.tl-date{font-size:13px;min-width:92px}
.tl-km{font-size:12px;color:#d1d5db;background:#16161e;border:1px solid #27272d;border-radius:4px;padding:2px 8px}
.tl-notes{font-size:12px;color:#4b5563;font-style:italic;flex:1}
.tl-latest-tag{font-size:9px;background:#1f1400;border:1px solid #78350f;color:#f59e0b;border-radius:4px;padding:1px 7px;letter-spacing:.5px}
.tl-btns{display:flex;gap:3px;margin-left:auto}
.tl-btn{background:none;border:none;color:#374151;padding:3px 4px;border-radius:4px;display:flex}
.form-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:10px;color:#4b5563;letter-spacing:.6px;font-weight:500}
.fld input,.fld select,.fld textarea{background:#0a0a0e;border:1px solid #27272d;border-radius:6px;padding:7px 10px;color:#e5e7eb;font-size:13px}
.form-btns{display:flex;gap:6px;margin-top:14px}
.section-divider{font-size:10px;color:#374151;letter-spacing:.5px;margin-bottom:9px;display:flex;align-items:center;gap:6px}
.overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#0d0d14;border:1px solid #27272d;border-radius:14px;padding:22px;max-width:400px;width:100%;box-shadow:0 16px 48px rgba(0,0,0,.8);max-height:90vh;overflow-y:auto}
.modal-title{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:900;margin-bottom:8px}
.modal-sub{font-size:12px;color:#6b7280;line-height:1.6;margin-bottom:16px}
.import-opt{border-radius:8px;padding:11px 14px;cursor:pointer;text-align:left;border:none;font-family:inherit;color:#e5e7eb;width:100%;margin-bottom:8px;transition:background .12s}
#data-menu-wrap{position:relative}
#data-menu{position:absolute;top:calc(100% + 6px);right:0;background:#0d0d14;border:1px solid #27272d;border-radius:10px;overflow:hidden;min-width:230px;box-shadow:0 8px 32px rgba(0,0,0,.7);z-index:100;display:none}
#data-menu.open{display:block}
.dm-section{padding:6px 12px 4px;font-size:10px;color:#374151;letter-spacing:.7px;border-bottom:1px solid #1a1a20;border-top:1px solid #1a1a20}
.dm-section:first-child{border-top:none}
.dm-item{padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:11px;transition:background .12s}
.dm-item:hover{background:rgba(255,255,255,.04)}
.dm-item-name{font-size:13px;color:#e5e7eb;font-weight:500}
.dm-item-sub{font-size:10px;color:#4b5563;margin-top:1px}
.panel-form{background:#0d0d14;border:1px solid #27272d;border-radius:10px;padding:13px 14px;margin:0 14px 10px}
.panel-form-title{font-size:10px;color:#374151;letter-spacing:.5px;margin-bottom:10px}
.fuel-stats{display:grid;grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));gap:8px;margin:0 14px 12px}
.fuel-stat{background:#0d0d14;border:1px solid #1a1a22;border-radius:10px;padding:12px 14px}
.fuel-stat-value{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;color:#e5e7eb}
.fuel-stat-label{font-size:10px;color:#374151;letter-spacing:.5px;margin-top:2px}
.fuel-stat.green .fuel-stat-value{color:#22c55e}
.fuel-stat.amber .fuel-stat-value{color:#f59e0b}
.fuel-stat.blue .fuel-stat-value{color:#60a5fa}
.fuel-stat.purple .fuel-stat-value{color:#a78bfa}
.fuel-stat.cyan .fuel-stat-value{color:#22d3ee}
.fuel-entry{background:#0d0d14;border:1px solid #1a1a22;border-radius:10px;padding:12px 14px;margin-bottom:8px}
.fuel-entry-header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fuel-type-badge{padding:3px 8px;border-radius:5px;font-size:10px;font-weight:700;letter-spacing:.5px}
.fuel-type-benzyna{background:rgba(239,68,68,.15);color:#ef4444;border:1px solid #7f1d1d}
.fuel-type-diesel{background:rgba(251,191,36,.15);color:#fbbf24;border:1px solid #92400e}
.fuel-type-lpg{background:rgba(34,197,94,.15);color:#22c55e;border:1px solid #166534}
.fuel-entry-date{font-size:13px;color:#9ca3af}
.fuel-entry-km{font-size:12px;color:#6b7280}
.fuel-entry-details{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px solid #1a1a22}
.fuel-detail{text-align:center}
.fuel-detail-value{font-size:14px;font-weight:600;color:#e5e7eb}
.fuel-detail-label{font-size:9px;color:#374151;letter-spacing:.3px}
.fuel-consumption{font-size:14px;font-weight:700;padding:4px 10px;border-radius:6px;margin-left:auto}
.fuel-consumption.good{background:rgba(34,197,94,.15);color:#22c55e}
.fuel-consumption.medium{background:rgba(251,191,36,.15);color:#fbbf24}
.fuel-consumption.bad{background:rgba(239,68,68,.15);color:#ef4444}
.fuel-savings{font-size:11px;color:#22c55e;margin-top:6px;padding:6px 10px;background:rgba(34,197,94,.08);border-radius:6px;border:1px solid rgba(34,197,94,.2)}
/* INSURANCE */
.ins-card{background:#0d0d14;border:1px solid #1a1a22;border-radius:10px;padding:14px;margin-bottom:10px}
.ins-card.expired{border-color:#991b1b;background:#1c0808}
.ins-card.warning{border-color:#92400e;background:#1c1408}
.ins-header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.ins-company{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;color:#e5e7eb}
.ins-policy{font-size:11px;color:#6b7280;background:#111118;border:1px solid #1e1e26;border-radius:4px;padding:2px 8px}
.ins-status{font-size:10px;font-weight:700;padding:3px 8px;border-radius:5px}
.ins-status.ok{background:rgba(34,197,94,.15);color:#22c55e;border:1px solid #166534}
.ins-status.warning{background:rgba(251,191,36,.15);color:#fbbf24;border:1px solid #92400e}
.ins-status.expired{background:rgba(239,68,68,.15);color:#ef4444;border:1px solid #7f1d1d}
.ins-dates{font-size:12px;color:#9ca3af;margin-bottom:8px}
.ins-phone{font-size:12px;color:#60a5fa;margin-bottom:8px}
.ins-coverage{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ins-cov-badge{font-size:10px;padding:3px 8px;border-radius:5px;background:rgba(167,139,250,.1);color:#a78bfa;border:1px solid #3b2a5e}
.ins-alert{margin-top:10px;padding:8px 12px;border-radius:6px;font-size:11px;display:flex;align-items:center;gap:8px}
.ins-alert.warning{background:rgba(251,191,36,.1);border:1px solid #92400e;color:#fcd34d}
.ins-alert.expired{background:rgba(239,68,68,.1);border:1px solid #991b1b;color:#fca5a5}
/* REPAIR */
.repair-card{background:#0d0d14;border:1px solid #1a1a22;border-radius:10px;padding:14px;margin-bottom:10px}
.repair-header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.repair-date{font-size:14px;font-weight:600;color:#e5e7eb}
.repair-km{font-size:12px;color:#6b7280;background:#111118;border:1px solid #1e1e26;border-radius:4px;padding:2px 8px}
.repair-type{font-size:10px;font-weight:700;padding:3px 8px;border-radius:5px}
.repair-type.planned{background:rgba(96,165,250,.15);color:#60a5fa;border:1px solid #1e3a5f}
.repair-type.breakdown{background:rgba(239,68,68,.15);color:#ef4444;border:1px solid #7f1d1d}
.repair-desc{font-size:13px;color:#9ca3af;line-height:1.5;margin-bottom:8px}
.repair-workshop{font-size:12px;color:#a78bfa;margin-bottom:6px}
.repair-parts{font-size:11px;color:#6b7280;font-style:italic;margin-bottom:6px}
.repair-cost{font-size:14px;font-weight:700;color:#22c55e}
/* INSPECTION */
.insp-card{background:#0d0d14;border:1px solid #1a1a22;border-radius:10px;padding:14px;margin-bottom:10px}
.insp-card.expired{border-color:#991b1b;background:#1c0808}
.insp-card.warning{border-color:#92400e;background:#1c1408}
.insp-header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.insp-title{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;color:#e5e7eb}
.insp-status{font-size:10px;font-weight:700;padding:3px 8px;border-radius:5px}
.insp-status.ok{background:rgba(34,211,238,.15);color:#22d3ee;border:1px solid #155e75}
.insp-status.warning{background:rgba(251,191,36,.15);color:#fbbf24;border:1px solid #92400e}
.insp-status.expired{background:rgba(239,68,68,.15);color:#ef4444;border:1px solid #7f1d1d}
.insp-date{font-size:12px;color:#9ca3af;margin-bottom:8px}
.insp-place{font-size:12px;color:#22d3ee;margin-bottom:6px}
.insp-scope{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.insp-scope-badge{font-size:10px;padding:3px 8px;border-radius:5px;background:rgba(34,211,238,.1);color:#22d3ee;border:1px solid #155e75}
.insp-alert{margin-top:10px;padding:8px 12px;border-radius:6px;font-size:11px;display:flex;align-items:center;gap:8px}
.insp-alert.warning{background:rgba(251,191,36,.1);border:1px solid #92400e;color:#fcd34d}
.insp-alert.expired{background:rgba(239,68,68,.1);border:1px solid #991b1b;color:#fca5a5}
/* NOTES (INNE) */
.note-card{background:#0d0d14;border:1px solid #1a1a22;border-radius:10px;padding:14px;margin-bottom:8px;display:flex;gap:14px;align-items:flex-start}
.note-num{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:900;color:#fb923c;min-width:36px;line-height:1;padding-top:2px}
.note-body{flex:1;min-width:0}
.note-desc{font-size:13px;color:#e5e7eb;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.note-edit-area{width:100%;background:#0a0a0e;border:1px solid #27272d;border-radius:6px;padding:8px 10px;color:#e5e7eb;font-size:13px;line-height:1.6;min-height:80px;resize:vertical;font-family:inherit}
/* CHECKBOX */
.chk-group{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chk-item{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:6px;cursor:pointer;background:rgba(255,255,255,.03);border:1px solid #27272d;font-size:12px;transition:all .15s}
.chk-item.checked{background:rgba(167,139,250,.1);border-color:#7c3aed;color:#a78bfa}
.chk-item.checked.cyan{background:rgba(34,211,238,.1);border-color:#0891b2;color:#22d3ee}
.chk-box{width:16px;height:16px;border-radius:4px;border:2px solid #374151;display:flex;align-items:center;justify-content:center;transition:all .15s}
.chk-item.checked .chk-box{background:#7c3aed;border-color:#7c3aed}
.chk-item.checked.cyan .chk-box{background:#0891b2;border-color:#0891b2}
#legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;padding:18px 14px 8px;border-top:1px solid #111118;margin-top:18px}
.leg-item{display:flex;align-items:center;gap:5px;font-size:10px;color:#27272d}
.leg-dot{width:7px;height:7px;border-radius:50%}
.empty{text-align:center;padding:50px 0;color:#1e1e26}
.empty-icon{font-size:38px;margin-bottom:8px}
.empty-txt{font-family:'Barlow Condensed',sans-serif;font-size:18px}
#toast{position:fixed;top:16px;right:16px;z-index:999;border-radius:8px;padding:9px 16px;font-size:12px;color:#e5e7eb;box-shadow:0 4px 20px rgba(0,0,0,.6);pointer-events:none;opacity:0;transition:opacity .2s;max-width:calc(100vw - 32px)}
#toast.show{opacity:1}
#pwa-install-banner{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a22;border:1px solid #f59e0b;border-radius:12px;padding:12px 20px;z-index:100;box-shadow:0 8px 32px rgba(0,0,0,.6);max-width:calc(100vw - 40px)}
#pwa-install-banner.show{display:flex;align-items:center;gap:12px}
#pwa-install-banner button{padding:8px 16px;border-radius:8px;font-weight:600;font-size:12px;cursor:pointer;border:none}
#pwa-install-banner .install-btn{background:#f59e0b;color:#000}
#pwa-install-banner .dismiss-btn{background:transparent;color:#6b7280;border:1px solid #27272d}
#offline-indicator{display:none;position:fixed;top:52px;left:0;right:0;background:#7f1d1d;color:#fca5a5;text-align:center;padding:6px;font-size:11px;z-index:100}
#offline-indicator.show{display:block}
@media print{body{background:#fff;color:#111;font-family:Arial,sans-serif}#topbar,#tabs,#legend,.btn,.toolbar,.tl-btns,#data-menu-wrap{display:none!important}.item-expand{display:block!important}}
</style>
</head>
<body>
<div id="toast"></div>
<div id="offline-indicator">📴 Tryb offline</div>
<div id="pwa-install-banner"><span style="font-size:13px">📲 Zainstaluj aplikację</span><button class="install-btn" onclick="installPWA()">Instaluj</button><button class="dismiss-btn" onclick="dismissInstall()">Później</button></div>
<input type="file" id="file-input" accept=".html">
<div id="topbar">

<div id="root"></div>
<script>
let deferredPrompt;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;setTimeout(()=>{if(deferredPrompt&&!localStorage.getItem('pwa_install_dismissed'))document.getElementById('pwa-install-banner').classList.add('show');},3000);});
function installPWA(){if(!deferredPrompt)return;deferredPrompt.prompt();deferredPrompt.userChoice.then(c=>{if(c.outcome==='accepted')toast('Zainstalowano!');deferredPrompt=null;document.getElementById('pwa-install-banner').classList.remove('show');});}
function dismissInstall(){document.getElementById('pwa-install-banner').classList.remove('show');localStorage.setItem('pwa_install_dismissed','true');}
window.addEventListener('online',()=>{document.getElementById('offline-indicator').classList.remove('show');toast('Online');});
window.addEventListener('offline',()=>{document.getElementById('offline-indicator').classList.add('show');});
if(!navigator.onLine)document.getElementById('offline-indicator').classList.add('show');

const DEFAULT_ITEMS=[{name:"Olej silnikowy",km:10000,mo:12},{name:"Filtr oleju",km:10000,mo:12},{name:"Filtr powietrza",km:20000,mo:24},{name:"Filtr kabinowy",km:15000,mo:12},{name:"Filtr paliwa",km:30000,mo:36},{name:"Płyn hamulcowy",km:null,mo:24},{name:"Płyn chłodniczy",km:null,mo:24},{name:"Klocki hamulcowe",km:30000,mo:null},{name:"Tarcze hamulcowe",km:60000,mo:null},{name:"Świece zapłonowe",km:30000,mo:null},{name:"Pasek rozrządu",km:60000,mo:60},{name:"Paski klinowe",km:60000,mo:60},{name:"Zmiana opon",km:null,mo:6}];
const SC={ok:{bg:"#091a10",border:"#166534",dot:"#22c55e",text:"#86efac",label:"OK"},warning:{bg:"#1c1408",border:"#92400e",dot:"#f59e0b",text:"#fcd34d",label:"WKRÓTCE"},overdue:{bg:"#1c0808",border:"#991b1b",dot:"#ef4444",text:"#fca5a5",label:"PRZETERMINOWANY"},unknown:{bg:"#111118",border:"#374151",dot:"#4b5563",text:"#6b7280",label:"BRAK DANYCH"}};
const FUEL_TYPES={benzyna:{label:'BENZYNA',color:'#ef4444'},diesel:{label:'DIESEL',color:'#fbbf24'},lpg:{label:'LPG',color:'#22c55e'}};
const LPG_FACTOR=0.17;
const COVERAGE_OPTIONS=['OC','AC','Zielona Karta','Szyby','Opony','NNW'];
const INSPECTION_SCOPE_OPTIONS=['Auto','Hak','LPG'];
const LINKED_GROUPS=[{trigger:"Olej silnikowy",linked:["Filtr oleju","Filtr powietrza","Filtr kabinowy"]}];
const _TPL=(()=>{let h=document.documentElement.outerHTML;h=h.replace(/window\.__PD__=\{[^<]*\}/,'window.__PD__=null');return h;})();

let _lsKey='autoserwis_main';
let S={cars:[],activeCar:null,appName:"AUTOSERWIS",viewMode:'service',expandedItem:null,addEntryFor:null,editIntervalFor:null,editEntry:null,showAddCar:false,showAddItem:false,editCarId:null,importData:null,linkedModal:null,showAddFuel:false,showAddInsurance:false,showAddRepair:false,showAddInspection:false,showAddNote:false,editNoteId:null,
draftAddCar:{name:"",plate:""},draftAddItem:{name:"",km:"",mo:""},draftAddEntry:{date:"",km:"",notes:""},draftEditEntry:{date:"",km:"",notes:""},draftInterval:{km:"",mo:""},
draftFuel:{date:"",km:"",liters:"",totalCost:"",fuelType:"benzyna",gasolinePrice:""},
draftInsurance:{policyNumber:"",insurer:"",dateFrom:"",dateTo:"",claimPhone:"",coverage:[],otherCoverage:""},
draftRepair:{date:"",km:"",description:"",workshop:"",workshopPhone:"",repairType:"planned",partsUsed:"",cost:""},
draftInspection:{validUntil:"",scope:[],placeName:"",placeAddress:""},
draftNote:{number:"",description:""}};

const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>new Date().toISOString().slice(0,10);
const fmtKm=n=>n!=null?Number(n).toLocaleString('pl-PL'):'—';
const fmtNum=(n,dec=2)=>n!=null?Number(n).toLocaleString('pl-PL',{minimumFractionDigits:dec,maximumFractionDigits:dec}):'—';
const fmtPLN=n=>n!=null?Number(n).toLocaleString('pl-PL',{minimumFractionDigits:2,maximumFractionDigits:2})+' zł':'—';
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function newCar(name,plate){return{id:uid(),name,plate,currentKm:0,items:DEFAULT_ITEMS.map(t=>({id:uid(),name:t.name,kmInterval:t.km,monthInterval:t.mo,history:[]})),fuelups:[],insurances:[],repairs:[],inspections:[],notes:[]};}

function getStatus(item,currentKm){const h=[...item.history].sort((a,b)=>new Date(b.date)-new Date(a.date));const latest=h[0];if(!latest)return{status:"unknown",nextKm:null,nextDate:null,kmLeft:null,daysLeft:null};let kmLeft=null,daysLeft=null,nextKm=null,nextDate=null;if(item.kmInterval&&latest.km!=null){nextKm=Number(latest.km)+item.kmInterval;kmLeft=nextKm-currentKm;}if(item.monthInterval&&latest.date){const d=new Date(latest.date);d.setMonth(d.getMonth()+item.monthInterval);nextDate=d.toISOString().slice(0,10);daysLeft=Math.round((d-new Date())/86400000);}const overdue=(kmLeft!=null&&kmLeft<0)||(daysLeft!=null&&daysLeft<0);const warning=!overdue&&((kmLeft!=null&&kmLeft<1500)||(daysLeft!=null&&daysLeft<30));return{status:overdue?"overdue":warning?"warning":"ok",nextKm,nextDate,kmLeft,daysLeft};}

function getInsuranceStatus(ins){if(!ins.dateTo)return{status:'unknown',daysLeft:null};const endDate=new Date(ins.dateTo);const now=new Date();const daysLeft=Math.round((endDate-now)/86400000);if(daysLeft<0)return{status:'expired',daysLeft};if(daysLeft<=7)return{status:'week',daysLeft};if(daysLeft<=30)return{status:'month',daysLeft};return{status:'ok',daysLeft};}
function getInsuranceAlerts(car){if(!car.insurances)return[];const alerts=[];car.insurances.forEach(ins=>{const{status,daysLeft}=getInsuranceStatus(ins);if(status==='expired')alerts.push({type:'expired',ins,daysLeft});else if(status==='week')alerts.push({type:'week',ins,daysLeft});else if(status==='month')alerts.push({type:'month',ins,daysLeft});});return alerts;}

function getInspectionStatus(insp){if(!insp.validUntil)return{status:'unknown',daysLeft:null};const endDate=new Date(insp.validUntil);const now=new Date();const daysLeft=Math.round((endDate-now)/86400000);if(daysLeft<0)return{status:'expired',daysLeft};if(daysLeft<=7)return{status:'week',daysLeft};if(daysLeft<=30)return{status:'month',daysLeft};return{status:'ok',daysLeft};}
function getInspectionAlerts(car){if(!car.inspections)return[];const alerts=[];car.inspections.forEach(insp=>{const{status,daysLeft}=getInspectionStatus(insp);if(status==='expired')alerts.push({type:'expired',insp,daysLeft});else if(status==='week')alerts.push({type:'week',insp,daysLeft});else if(status==='month')alerts.push({type:'month',insp,daysLeft});});return alerts;}

function getFuelStats(car){if(!car.fuelups||car.fuelups.length===0)return null;const sorted=[...car.fuelups].sort((a,b)=>a.km-b.km);let totalKm=0,totalLiters=0,totalCost=0,totalSavings=0;const consumptions=[];for(let i=1;i<sorted.length;i++){const prev=sorted[i-1];const curr=sorted[i];const distance=curr.km-prev.km;if(distance>0&&curr.liters>0){const consumption=(curr.liters/distance)*100;consumptions.push({consumption,distance,fuelType:curr.fuelType});totalKm+=distance;totalLiters+=curr.liters;totalCost+=curr.totalCost||0;if(curr.fuelType==='lpg'){const gasPrice=curr.gasolinePrice||getLastGasolinePrice(car,curr.date);if(gasPrice>0){const equivalentGasLiters=curr.liters*(1-LPG_FACTOR);const wouldCostGas=equivalentGasLiters*gasPrice;const actualCost=curr.totalCost||0;totalSavings+=Math.max(0,wouldCostGas-actualCost);}}}}if(sorted.length===1){totalCost=sorted[0].totalCost||0;totalLiters=sorted[0].liters||0;}const avgConsumption=consumptions.length>0?consumptions.reduce((a,c)=>a+c.consumption,0)/consumptions.length:null;return{totalKm,totalLiters,totalCost,totalSavings,avgConsumption,entriesCount:car.fuelups.length};}
function getLastGasolinePrice(car,beforeDate){if(!car.fuelups)return 0;const sorted=[...car.fuelups].filter(f=>f.fuelType==='benzyna'&&f.totalCost>0&&f.liters>0&&f.date<=beforeDate).sort((a,b)=>new Date(b.date)-new Date(a.date));if(sorted.length>0)return sorted[0].totalCost/sorted[0].liters;return 0;}
function getConsumptionForEntry(car,entryId){if(!car.fuelups)return null;const sorted=[...car.fuelups].sort((a,b)=>a.km-b.km);const idx=sorted.findIndex(f=>f.id===entryId);if(idx<=0)return null;const prev=sorted[idx-1];const curr=sorted[idx];const distance=curr.km-prev.km;if(distance<=0||curr.liters<=0)return null;return{consumption:(curr.liters/distance)*100,distance};}
function getLPGSavings(car,entry){if(entry.fuelType!=='lpg')return null;const gasPrice=entry.gasolinePrice||getLastGasolinePrice(car,entry.date);if(gasPrice<=0||!entry.liters||!entry.totalCost)return null;const equivalentGasLiters=entry.liters*(1-LPG_FACTOR);const wouldCostGas=equivalentGasLiters*gasPrice;return Math.max(0,wouldCostGas-entry.totalCost);}

function loadState(){const instanceId=window.__PD__?.instanceId||'main';_lsKey=`autoserwis_${instanceId}`;try{const d=JSON.parse(localStorage.getItem(_lsKey)||'null');if(d&&Array.isArray(d.cars)&&d._seeded){S.cars=d.cars.map(c=>({...c,fuelups:c.fuelups||[],insurances:c.insurances||[],repairs:c.repairs||[],inspections:c.inspections||[],notes:c.notes||[]}));S.activeCar=d.cars[0]?.id||null;if(d.appName)S.appName=d.appName;return;}}catch(e){}if(window.__PD__?.fresh){if(window.__PD__.appName)S.appName=window.__PD__.appName;S.cars=[];S.activeCar=null;saveState();return;}if(window.__PD__!==null&&window.__PD__!==undefined){S.cars=(window.__PD__.cars||[]).map(c=>({...c,fuelups:c.fuelups||[],insurances:c.insurances||[],repairs:c.repairs||[],inspections:c.inspections||[],notes:c.notes||[]}));S.activeCar=S.cars[0]?.id||null;if(window.__PD__.appName)S.appName=window.__PD__.appName;saveState();return;}const c=newCar("Moje auto","");S.cars=[c];S.activeCar=c.id;saveState();}

function saveState(){try{localStorage.setItem(_lsKey,JSON.stringify({cars:S.cars,appName:S.appName,_seeded:true}));}catch(e){}}
function updateAppTitle(){const el=document.getElementById('app-name-display');if(el)el.textContent=S.appName;document.title=S.appName;}
function editAppName(){const val=prompt('Podaj nową nazwę:',S.appName);if(val===null||!val.trim())return;S.appName=val.trim().toUpperCase();saveState();renderAppName();toast('Zmieniono!');}
function renderAppName(){const el=document.getElementById('app-name-display');if(el)el.textContent=S.appName;document.title=S.appName;}

let _toastTimer;function toast(msg,type='ok'){const el=document.getElementById('toast');el.textContent=msg;el.style.background=type==='err'?'#7f1d1d':'#14532d';el.style.border=`1px solid ${type==='err'?'#dc2626':'#16a34a'}`;el.classList.add('show');clearTimeout(_toastTimer);_toastTimer=setTimeout(()=>el.classList.remove('show'),2500);}

function toggleDataMenu(){const m=document.getElementById('data-menu');const c=document.getElementById('data-chev');const open=m.classList.toggle('open');c.innerHTML=open?'<path d="M18 15l-6-6-6 6"/>':'<path d="M6 9l6 6 6-6"/>';}
function closeDataMenu(){document.getElementById('data-menu').classList.remove('open');document.getElementById('data-chev').innerHTML='<path d="M6 9l6 6 6-6"/>';}
document.addEventListener('click',e=>{if(!e.target.closest('#data-menu-wrap'))closeDataMenu();});

function buildExportHTML(cars){const payload={cars,appName:S.appName,instanceId:uid()};return _TPL.replace('window.__PD__=null','window.__PD__='+JSON.stringify(payload));}
let _saveHandle=null;
function fallbackDownload(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function saveWithPicker(blob,suggestedName){if(window.showSaveFilePicker){try{const handle=await window.showSaveFilePicker({suggestedName,types:[{description:'HTML',accept:{'text/html':['.html']}}],startIn:'downloads'});const w=await handle.createWritable();await w.write(blob);await w.close();return handle;}catch(e){if(e.name==='AbortError')return null;fallbackDownload(blob,suggestedName);return true;}}fallbackDownload(blob,suggestedName);return true;}
async function doQuickSave(){const blob=new Blob([buildExportHTML(S.cars)],{type:'text/html;charset=utf-8'});const name=(S.appName.toLowerCase().replace(/\s+/g,'-')||'autoserwis')+'.html';if(_saveHandle){try{const w=await _saveHandle.createWritable();await w.write(blob);await w.close();toast('✓ Zapisano!');return;}catch(e){_saveHandle=null;}}const h=await saveWithPicker(blob,name);if(h&&h!==true)_saveHandle=h;if(h)toast('✓ Zapisano!');}
function doExportFull(){closeDataMenu();const blob=new Blob([buildExportHTML(S.cars)],{type:'text/html;charset=utf-8'});const name=(S.appName.toLowerCase().replace(/\s+/g,'-')||'kopia')+'-'+today()+'.html';saveWithPicker(blob,name).then(h=>{if(h)toast('Pobrano!');});}
function doPrintPDF(){const appName=S.appName;const now=new Date().toLocaleDateString('pl-PL',{day:'2-digit',month:'long',year:'numeric'});const w=window.open('','_blank');if(w){w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${appName}</title><style>body{font-family:Arial,sans-serif;padding:24px}</style></head><body><h1>🚗 ${appName}</h1><p>${now}</p><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close();}}

document.getElementById('file-input').addEventListener('change',function(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{try{const text=ev.target.result;const match=text.match(/window\.__PD__=(\{[\s\S]*?\})\s*<\/script>/);if(!match)throw new Error('Brak danych');const payload=JSON.parse(match[1]);if(!payload.cars||!Array.isArray(payload.cars))throw new Error('Błąd');S.importData={cars:payload.cars,appName:payload.appName||null};render();}catch(err){toast('Błąd pliku','err');}};reader.readAsText(file);this.value='';});

function doImport(mode){const incoming=S.importData.cars.map(c=>({...c,id:uid(),fuelups:(c.fuelups||[]).map(f=>({...f,id:uid()})),insurances:(c.insurances||[]).map(i=>({...i,id:uid()})),repairs:(c.repairs||[]).map(r=>({...r,id:uid()})),inspections:(c.inspections||[]).map(i=>({...i,id:uid()})),notes:(c.notes||[]).map(n=>({...n,id:uid()})),items:(c.items||[]).map(i=>({...i,id:uid(),history:(i.history||[]).map(h=>({...h,id:uid()}))}))}));if(mode==='replace'){S.cars=incoming;S.activeCar=incoming[0]?.id||null;if(S.importData.appName){S.appName=S.importData.appName;updateAppTitle();}toast(`Wczytano ${incoming.length} aut`);}else{S.cars=[...S.cars,...incoming];S.activeCar=incoming[0]?.id||S.activeCar;toast(`Dodano ${incoming.length} aut`);}S.importData=null;saveState();render();}

function render(){const root=document.getElementById('root');const car=S.cars.find(c=>c.id===S.activeCar);let html='';
// Import modal
if(S.importData){const d=S.importData;html+=`<div class="overlay fade" onclick="if(event.target===this){S.importData=null;render()}"><div class="modal"><div class="modal-title">📂 Wczytaj dane</div><div class="modal-sub">Znaleziono <strong style="color:#e5e7eb">${d.cars.length} aut</strong></div><button class="import-opt" style="background:rgba(96,165,250,.1);border:1px solid #1e3a5f" onclick="doImport('add')"><div style="font-size:13px;font-weight:600;color:#60a5fa">➕ Dodaj do istniejących</div></button><button class="import-opt" style="background:rgba(239,68,68,.08);border:1px solid #7f1d1d" onclick="doImport('replace')"><div style="font-size:13px;font-weight:600;color:#ef4444">🔄 Zastąp wszystkie</div></button><button class="btn btn-ghost btn-sm" onclick="S.importData=null;render()">Anuluj</button></div></div>`;}
// Linked modal
if(S.linkedModal){const lm=S.linkedModal;const checkedCount=lm.items.filter(i=>i.checked).length;html+=`<div class="overlay fade"><div class="modal"><div class="modal-title">🔗 Powiązane filtry</div><div class="modal-sub">Data: ${lm.entry.date}</div><div style="display:flex;flex-direction:column;gap:8px;margin-bottom:18px">${lm.items.map(i=>`<label style="display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:8px;cursor:pointer;background:${i.checked?'rgba(245,158,11,.1)':'rgba(255,255,255,.03)'};border:1px solid ${i.checked?'#92400e':'#27272d'}" onclick="toggleLinkedItem('${i.id}')"><div style="width:20px;height:20px;border-radius:5px;border:2px solid ${i.checked?'#f59e0b':'#374151'};background:${i.checked?'#f59e0b':'transparent'};display:flex;align-items:center;justify-content:center">${i.checked?'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>':''}</div><span style="font-size:14px">${esc(i.name)}</span></label>`).join('')}</div><div style="display:flex;gap:8px"><button class="btn btn-amber" onclick="saveLinkedEntries()" ${checkedCount===0?'disabled style="opacity:.4"':''}>Zapisz (${checkedCount})</button><button class="btn btn-ghost" onclick="skipLinkedEntries()">Pomiń</button></div></div></div>`;}
// Tabs
html+='<div id="tabs">';S.cars.forEach(c=>{const cnt=c.items.reduce((a,i)=>{const s=getStatus(i,c.currentKm).status;if(s==='overdue')a.o++;else if(s==='warning')a.w++;return a;},{o:0,w:0});const insAlerts=getInsuranceAlerts(c);const inspAlerts=getInspectionAlerts(c);const active=c.id===S.activeCar;html+=`<button class="tab${active?' active':''}" onclick="setActiveCar('${c.id}')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 17H3a2 2 0 01-2-2v-4l3-6h16l3 6v4a2 2 0 01-2 2h-2M7 17h10M9 17a2 2 0 100 4 2 2 0 000-4zm6 0a2 2 0 100 4 2 2 0 000-4z"/></svg>${esc(c.name)}${c.plate?`<span style="font-size:10px;color:#374151;letter-spacing:1px">${esc(c.plate)}</span>`:''}${cnt.o>0?`<span class="badge badge-red">${cnt.o}</span>`:''}${!cnt.o&&cnt.w>0?`<span class="badge badge-amber">${cnt.w}</span>`:''}${insAlerts.length>0?`<span class="badge badge-purple">${insAlerts.length}</span>`:''}${inspAlerts.length>0?`<span class="badge badge-cyan">${inspAlerts.length}</span>`:''}</button>`;});
html+=`<button class="tab" onclick="S.showAddCar=!S.showAddCar;render()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Dodaj auto</button></div>`;
// Add car form

function openAddInspection(){S.showAddInspection=true;S.draftInspection={validUntil:'',scope:['Auto'],placeName:'',placeAddress:''};render();}
function toggleInspectionScope(scope){const idx=S.draftInspection.scope.indexOf(scope);if(idx>=0)S.draftInspection.scope.splice(idx,1);else S.draftInspection.scope.push(scope);render();}
function addInspection(carId){const car=S.cars.find(c=>c.id===carId);if(!car)return;if(!S.draftInspection.validUntil){toast('Podaj datę ważności','err');return;}const insp={id:uid(),validUntil:S.draftInspection.validUntil,scope:[...S.draftInspection.scope],placeName:S.draftInspection.placeName,placeAddress:S.draftInspection.placeAddress};if(!car.inspections)car.inspections=[];car.inspections.push(insp);S.showAddInspection=false;S.draftInspection={validUntil:'',scope:[],placeName:'',placeAddress:''};saveState();render();toast('Przegląd dodany!');}
function deleteInspection(carId,inspId){const car=S.cars.find(c=>c.id===carId);if(!car||!car.inspections)return;car.inspections=car.inspections.filter(i=>i.id!==inspId);saveState();render();toast('Usunięto.');}

// REPAIRS
function openAddRepair(){S.showAddRepair=true;const car=S.cars.find(c=>c.id===S.activeCar);S.draftRepair={date:today(),km:car?.currentKm||'',description:'',workshop:'',workshopPhone:'',repairType:'planned',partsUsed:'',cost:''};render();}
function addRepair(carId){const car=S.cars.find(c=>c.id===carId);if(!car)return;if(!S.draftRepair.date){toast('Podaj datę','err');return;}const repair={id:uid(),date:S.draftRepair.date,km:parseFloat(S.draftRepair.km)||0,description:S.draftRepair.description,workshop:S.draftRepair.workshop,workshopPhone:S.draftRepair.workshopPhone,repairType:S.draftRepair.repairType,partsUsed:S.draftRepair.partsUsed,cost:parseFloat(S.draftRepair.cost)||0};if(!car.repairs)car.repairs=[];car.repairs.push(repair);if(repair.km>car.currentKm)car.currentKm=repair.km;S.showAddRepair=false;S.draftRepair={date:'',km:'',description:'',workshop:'',workshopPhone:'',repairType:'planned',partsUsed:'',cost:''};saveState();render();toast('Naprawa dodana!');}
function deleteRepair(carId,repairId){const car=S.cars.find(c=>c.id===carId);if(!car||!car.repairs)return;car.repairs=car.repairs.filter(r=>r.id!==repairId);saveState();render();toast('Usunięto.');}

// NOTES (INNE)
function openAddNote(){S.showAddNote=true;const car=S.cars.find(c=>c.id===S.activeCar);const notes=car?.notes||[];const nextNum=notes.length>0?Math.max(...notes.map(n=>parseInt(n.number)||0))+1:1;S.draftNote={number:String(nextNum),description:''};render();}
function addNote(carId){const car=S.cars.find(c=>c.id===carId);if(!car)return;if(!S.draftNote.description.trim()){toast('Wpisz opis','err');return;}const note={id:uid(),number:parseInt(S.draftNote.number)||1,description:S.draftNote.description.trim()};if(!car.notes)car.notes=[];car.notes.push(note);S.showAddNote=false;S.draftNote={number:'',description:''};saveState();render();toast('Wpis dodany!');}
function updateNoteField(carId,noteId,field,value){const car=S.cars.find(c=>c.id===carId);if(!car||!car.notes)return;const note=car.notes.find(n=>n.id===noteId);if(!note)return;note[field]=field==='number'?parseInt(value)||1:value;}
function deleteNote(carId,noteId){const car=S.cars.find(c=>c.id===carId);if(!car||!car.notes)return;if(!confirm('Usunąć wpis?'))return;car.notes=car.notes.filter(n=>n.id!==noteId);saveState();render();toast('Usunięto.');}

// SERVICE WORKER
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').then(reg=>{console.log('[PWA] SW OK');reg.onupdatefound=()=>{const newWorker=reg.installing;newWorker.onstatechange=()=>{if(newWorker.state==='installed'&&navigator.serviceWorker.controller)toast('Nowa wersja!');};};}).catch(err=>console.log('[PWA] SW error:',err));});}

loadState();updateAppTitle();render();

setTimeout(()=>{const car=S.cars.find(c=>c.id===S.activeCar);if(car){
const insAlerts=getInsuranceAlerts(car);insAlerts.forEach(a=>{if(a.type==='expired')toast(`⚠️ Polisa ${a.ins.insurer} wygasła!`,'err');else if(a.type==='week')toast(`⏰ Polisa ${a.ins.insurer} wygasa za ${a.daysLeft} dni!`,'err');else if(a.type==='month')toast(`📋 Polisa ${a.ins.insurer} wygasa za ${a.daysLeft} dni`);});
const inspAlerts=getInspectionAlerts(car);inspAlerts.forEach(a=>{if(a.type==='expired')toast(`⚠️ Przegląd wygasł!`,'err');else if(a.type==='week')toast(`⏰ Przegląd wygasa za ${a.daysLeft} dni!`,'err');else if(a.type==='month')toast(`📋 Przegląd wygasa za ${a.daysLeft} dni`);});
}},1500);
</script>
